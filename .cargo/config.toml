[env]
# libopus bundled in audiopus_sys declares cmake_minimum_required < 3.5, which CMake 4.x refuses without this.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
# Always build the bundled libopus and link it statically, even if Homebrew has an opus.dylib, so the binary
# (and SideMic.app) runs on Macs that don't have Homebrew. On Windows this is what happens anyway.
LIBOPUS_NO_PKG = "1"
LIBOPUS_STATIC = "1"
