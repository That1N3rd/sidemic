[package]
name = "micbridge-rs"
description = "Microphone passthrough sidecar for Sunshine/Apollo + Moonlight"
license = "MIT"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "micbridge"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
base64 = "0.22"
chrono = "0.4.45"
cpal = "0.15"
opus = "0.3"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
winresource = "0.1.34"
